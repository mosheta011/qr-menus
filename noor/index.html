<style>
/* ===== Maison Noor — luxury café ===== */
:root{
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --ar-display:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --ar-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --pattern:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M14%200L28%2014L14%2028L0%2014Z'%20fill='none'%20stroke='%23b89650'%20stroke-width='.7'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='1.1'%20fill='%23b89650'/%3E%3C/svg%3E");
  --pad:20px;
}
html[data-theme=night]{
  color-scheme:dark;
  --bg:#0b1310; --bg2:#111b17; --bg3:#182620; --sheet:#0f1914;
  --ink:#f2ebdc; --muted:#b9b3a3; --faint:#97917f;
  --gold:#d8bb82; --gold-hi:#f1dfb4; --gold-ink:#1b1507;
  --line:rgba(216,187,130,.2); --line2:rgba(216,187,130,.4);
  --glow:rgba(44,102,80,.5); --scrim:rgba(3,8,5,.7);
  --danger:#f19b8d; --ok:#96d8ae;
  --plate-a:30%; --plate-b:12%; --plate-ink:80%; --plate-s1:40%; --plate-s2:30%;
}
html[data-theme=day]{
  color-scheme:light;
  --bg:#f6f0e3; --bg2:#fffaf0; --bg3:#efe6d3; --sheet:#fbf6ea;
  --ink:#1d1a14; --muted:#524c3d; --faint:#645d4b;
  --gold:#7f5b17; --gold-hi:#664610; --gold-ink:#fff8e8;
  --line:rgba(127,91,23,.24); --line2:rgba(127,91,23,.46);
  --glow:rgba(216,187,130,.6); --scrim:rgba(30,24,10,.5);
  --danger:#a63a2a; --ok:#1d6b3f;
  --plate-a:92%; --plate-b:80%; --plate-ink:26%; --plate-s1:62%; --plate-s2:48%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-width:320px}
body.locked{overflow:hidden}
html[lang=ar] body{font-family:var(--ar-body);font-size:16px;line-height:1.7}
html[lang=ar] *{letter-spacing:0!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
a{color:inherit}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
svg{display:block;flex:none}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
bdi.m{unicode-bidi:isolate;white-space:nowrap}
.app{position:relative;overflow-x:clip}
.app>*{padding-inline:max(var(--pad),calc((100% - 720px)/2))}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;text-align:center;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:30px;
  background:radial-gradient(90% 60% at 50% 0%,var(--glow),transparent 72%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--pattern);background-size:28px 28px;opacity:.5;
  -webkit-mask-image:linear-gradient(#000 0,transparent 78%);mask-image:linear-gradient(#000 0,transparent 78%)}
html[data-theme=day] .hero::before{opacity:.38}
.util{display:flex;align-items:center;justify-content:space-between;gap:10px}
.util-r{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;border-radius:999px;padding:0;height:44px;align-items:center;box-shadow:inset 0 0 0 1px var(--line2)}
.lang button{min-width:46px;height:44px;padding:0 10px;border-radius:999px;font:600 12px var(--body);letter-spacing:.08em;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.lang button[lang=ar]{font-family:var(--ar-body);font-size:13px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold);transition:background .2s,color .2s}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{background:var(--bg3)}
.icon-btn[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.chip-btn{height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font:600 12px var(--body);letter-spacing:.08em;color:var(--gold);display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{background:var(--bg3)}
.emblem{width:92px;height:auto;margin:18px auto 6px;color:var(--gold)}
.eyebrow{font:600 11px/1.4 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
html[lang=ar] .eyebrow{font-size:13px;text-transform:none}
.brand{margin:8px 0 0;font-weight:400}
.brand span{display:block}
.brand .b1{font:500 13px/1 var(--body);letter-spacing:.7em;text-transform:uppercase;color:var(--ink);padding-inline-start:.7em}
.brand .b2{font:italic 500 clamp(64px,22vw,96px)/.95 var(--display);color:var(--gold-hi);margin-top:6px;padding-bottom:6px}
html[lang=ar] .brand .b1{font-family:var(--ar-display);font-size:22px;letter-spacing:0;padding:0;text-transform:none}
html[lang=ar] .brand .b2{font-family:var(--ar-display);font-style:normal;font-weight:700;line-height:1.2}
.tagline{font:italic 400 17px/1.45 var(--display);color:var(--muted);max-width:30ch;margin:6px auto 0}
html[lang=ar] .tagline{font-family:var(--ar-display);font-style:normal;font-size:20px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 14px;color:var(--gold);max-width:260px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line2))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.status.is-open i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.status em{font-style:normal;font-weight:500;color:var(--muted)}
.table-chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 16px;border:1px solid var(--line2);border-radius:999px;font:600 13px var(--body);color:var(--gold-hi);background:var(--bg2)}
.table-chip svg{width:16px;height:16px}
.hero-cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);transition:background .2s,color .2s}
html[lang=ar] .btn{font-size:15px;text-transform:none}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.ghost{color:var(--gold)}
.btn.ghost:hover{background:var(--bg3)}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:0}
.tb-row{display:flex;gap:8px;align-items:center}
.tb-row .icon-btn{width:46px;height:46px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;background:var(--bg2);color:var(--gold)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;height:44px;border:0;background:none;outline:0;color:var(--ink)}
.search input::placeholder{color:var(--faint);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search:focus-within{border-color:var(--gold-hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font:700 11px/20px var(--body);text-align:center;border:2px solid var(--bg)}
.cats{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad)}
.cats::-webkit-scrollbar{display:none}
.cats button{position:relative;flex:none;padding:17px 2px 16px;font:700 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .2s}
html[lang=ar] .cats button{font-size:15px;text-transform:none}
.cats button::after{content:"";position:absolute;inset-inline:0;bottom:6px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.cats button.on{color:var(--gold-hi)}
.cats button.on::after{transform:scaleX(1)}

/* ---------- menu ---------- */
main{padding-top:28px;padding-bottom:150px;min-height:60vh}
.sec-title{font:italic 500 30px/1.15 var(--display);color:var(--ink)}
html[lang=ar] .sec-title{font-family:var(--ar-display);font-style:normal;font-weight:700;font-size:32px}
.sec-title.sm{font-size:24px}
.pick{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px;border:1px solid var(--line2);border-radius:22px;background:linear-gradient(135deg,var(--bg3),var(--bg2));cursor:pointer;margin-bottom:34px;overflow:hidden}
.pick::after{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:17px;pointer-events:none}
.pick .plate{width:96px;height:96px}
.pick h2{font:500 24px/1.15 var(--display);margin:6px 0 4px}
.pick .name-btn{font:inherit}
html[lang=ar] .pick h2{font-family:var(--ar-display);font-weight:700;font-size:26px}
.pick p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick-foot{display:flex;align-items:center;gap:14px;margin-top:12px}
.sigs{margin-bottom:34px}
.sig-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad) * -1);padding:14px var(--pad) 6px}
.sig-row::-webkit-scrollbar{display:none}
.sig{flex:none;width:148px;text-align:center;padding:16px 10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit}
.sig .plate{width:72px;height:72px}
.sig b{font:500 16px/1.2 var(--display);display:block}
html[lang=ar] .sig b{font-family:var(--ar-display);font-size:18px;font-weight:700}
.sig .price{font-size:14px}
.sig.off b,.sig.off .price{color:var(--muted)}
.sig.off .plate{filter:saturate(.4)}

.afbar{margin-bottom:22px}
.af-chips{display:flex;flex-wrap:wrap;gap:8px}
.af-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 14px;border:1px solid var(--line2);border-radius:999px;font:600 13px var(--body);color:var(--gold-hi);background:var(--bg2)}
.af-chip svg{width:16px;height:16px}
.af-chip span{display:grid;place-items:center;width:24px;height:24px}
.af-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.link{color:var(--gold-hi);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}

.cat{margin-bottom:46px;scroll-margin-top:calc(var(--tb,110px) + 6px)}
.cat-head{text-align:center;margin-bottom:10px}
.cat-ornament{color:var(--gold);display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px}
.cat-ornament::before,.cat-ornament::after{content:"";width:44px;height:1px;background:var(--line2)}
.cat-ornament i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.cat-note{margin-top:8px;font:italic 400 15px/1.5 var(--display);color:var(--muted);max-width:36ch;margin-inline:auto}
html[lang=ar] .cat-note{font-family:var(--ar-display);font-style:normal;font-size:18px}
.serve{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:5px 14px;border-radius:999px;font:700 11px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);color:var(--gold-hi)}
html[lang=ar] .serve{font-size:13px;text-transform:none}
.serve i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.serve.off{color:var(--muted)}
.serve.off i{background:var(--faint)}
.list{display:block}
.item{position:relative;display:grid;gap:5px;padding:20px 0 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.i-head{display:flex;align-items:baseline;gap:10px}
.name{font:500 21px/1.22 var(--display);min-width:0;overflow-wrap:anywhere}
html[lang=ar] .name{font-family:var(--ar-display);font-weight:700;font-size:23px}
.name-btn{display:block;font:inherit;color:inherit;text-align:start;letter-spacing:inherit;cursor:pointer;padding-block:10px;margin-block:-10px}
.name-btn:focus-visible{outline-offset:4px}
.leader{flex:1;min-width:14px;border-bottom:1px dotted var(--line2);transform:translateY(-4px)}
.price{font:600 15px var(--body);color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.i-notes{font:italic 400 14.5px/1.4 var(--display);color:var(--gold)}
html[lang=ar] .i-notes{font-family:var(--ar-display);font-style:normal;font-size:17px}
.i-desc{font-size:14px;color:var(--muted)}
.i-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.lab{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line2);color:var(--gold-hi)}
html[lang=ar] .lab{font-size:12px;text-transform:none}
.lab svg{width:12px;height:12px}
.lab.sig-l{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lab.new-l{border-style:dashed}
.dot-badge{display:grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:50%;border:1px solid var(--line2);font:700 9.5px/1 var(--body);letter-spacing:.02em;color:var(--muted)}
.av{font-size:12px;color:var(--muted);font-weight:600}
.item.off .name-btn{color:var(--muted)}
.item.off .i-notes,.item.off .i-desc{color:var(--faint)}
.item.off .price{color:var(--muted)}
.acts{display:flex;gap:4px;flex:none}
.heart{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.heart svg{width:22px;height:22px;transition:transform .2s}
.heart[aria-pressed=true]{color:var(--gold-hi)}
.heart[aria-pressed=true] svg{fill:currentColor}
.heart:active svg{transform:scale(.85)}
.icon-btn[data-fav][aria-pressed=true] svg{fill:currentColor}
.add{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);transition:background .2s,color .2s}
.add svg{width:20px;height:20px}
.add:hover,.add:active{background:var(--gold);color:var(--gold-ink)}
.add:disabled{opacity:.35;pointer-events:none}
.none{text-align:center;color:var(--muted);padding:60px 0;font:italic 400 18px/1.5 var(--display)}
html[lang=ar] .none{font-family:var(--ar-display);font-style:normal;font-size:20px}

.foot{padding-top:10px;padding-bottom:140px;text-align:center;font-size:12px;color:var(--faint);display:grid;gap:6px;border-top:1px solid var(--line)}
.foot .demo{color:var(--gold)}

/* ---------- plate (medallion) ---------- */
.plate{--h:30;position:relative;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 50% 32%,hsl(var(--h) var(--plate-s1) var(--plate-a)),hsl(var(--h) var(--plate-s2) var(--plate-b)) 78%);
  border:1px solid var(--line2);color:hsl(var(--h) 58% var(--plate-ink));box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line)}
.plate svg{width:56%;height:56%}

/* ---------- dock ---------- */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px var(--pad) max(14px,env(safe-area-inset-bottom));pointer-events:none;
  background:linear-gradient(transparent,var(--bg) 60%)}
.dock>*{pointer-events:auto}
.round{width:54px;height:54px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);color:var(--gold);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);flex:none}
.round svg{width:22px;height:22px}
.reserve-bar,.cartbar{height:54px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 22px;box-shadow:0 10px 30px rgba(0,0,0,.34);max-width:520px;flex:1;min-width:0}
.reserve-bar{justify-content:center;background:var(--bg2);border:1px solid var(--gold);color:var(--gold-hi);font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .reserve-bar{font-size:15px;text-transform:none}
.reserve-bar svg{width:20px;height:20px}
.cartbar{background:var(--gold);color:var(--gold-ink);font:700 14px var(--body);justify-content:space-between}
.cartbar .cb-count{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--gold-ink);color:var(--gold-hi);font-size:13px}
html[data-theme=day] .cartbar .cb-count{color:var(--gold-ink);background:var(--gold-hi)}
.cartbar .cb-label{flex:1;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.cartbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04)}}
body.has-cart .reserve-bar{display:none}
@media (max-width:380px){body.has-cart .round{width:48px;height:48px}.cartbar{padding:0 16px;gap:8px}}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:580px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);
  border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;overflow:hidden;outline:0;animation:rise .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:28px;border-bottom:1px solid var(--line2);max-height:88vh;max-height:88dvh}}
#sheetBody{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-pad{padding:22px var(--pad) 24px}
.sheet-acts{position:absolute;top:12px;inset-inline:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.sheet-acts>*{pointer-events:auto}
.sheet-acts .l{display:flex;gap:8px}
.close,.sheet-acts .icon-btn{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold)}
.sheet-acts .icon-btn[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.close svg{width:20px;height:20px}
.plate-wrap{position:relative;display:grid;place-items:center;padding:64px 0 26px;background:radial-gradient(70% 90% at 50% 40%,var(--glow),transparent 75%)}
.plate-wrap::before{content:"";position:absolute;inset:0;background-image:var(--pattern);background-size:28px 28px;opacity:.4;-webkit-mask-image:linear-gradient(transparent,#000 40%,transparent);mask-image:linear-gradient(transparent,#000 40%,transparent)}
.plate-wrap .plate{width:150px;height:150px}
.sheet-title{font:500 32px/1.12 var(--display);margin:8px 0 6px;color:var(--ink)}
html[lang=ar] .sheet-title{font-family:var(--ar-display);font-weight:700;font-size:34px}
.sheet-title.plain{margin-top:34px}
.sheet-desc{color:var(--muted);font-size:15px;margin:10px 0}
.notes{font:italic 400 17px/1.4 var(--display);color:var(--gold)}
html[lang=ar] .notes{font-family:var(--ar-display);font-style:normal;font-size:19px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.fact{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.fact svg{width:15px;height:15px;color:var(--gold)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;margin:18px 0}
.meter{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .meter{font-size:14px;text-transform:none}
.meter span.dots{display:inline-flex;gap:5px;padding-inline-end:2px}
.meter i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold)}
.meter i.on{background:var(--gold)}
.sub{font:700 11px/1.3 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
html[lang=ar] .sub{font-size:14px;text-transform:none}
.sub svg{width:16px;height:16px}
.story p{font-size:15px;color:var(--muted);line-height:1.7}
.pair-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad) * -1);padding:2px var(--pad)}
.pair-row::-webkit-scrollbar{display:none}
.pair{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);text-align:start;max-width:260px}
html[dir=rtl] .pair{padding:10px 10px 10px 16px}
.pair .plate{width:44px;height:44px}
.pair b{display:block;font:500 15px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
html[lang=ar] .pair b{font-family:var(--ar-display);font-weight:700;font-size:17px}
.pair small{font-size:12px;color:var(--gold-hi);font-weight:700}
.alg{font-size:13px;color:var(--muted);margin-top:14px}
.alg b{color:var(--ink)}
fieldset.opt{border:0;padding:0;margin:20px 0 0;min-width:0}
fieldset.opt legend{padding:0;margin-bottom:8px;font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;gap:10px;align-items:baseline;width:100%}
html[lang=ar] fieldset.opt legend{font-size:14px;text-transform:none}
fieldset.opt legend small{font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--faint);font-weight:600}
.choice{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.choice:has(input:checked){border-color:var(--gold);background:var(--bg3)}
.choice input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0;background:none}
.choice input[type=checkbox]{border-radius:6px}
.choice input:checked{background:var(--gold)}
.choice input:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold-ink)}
.choice input[type=checkbox]:checked::after{border-radius:2px;width:9px;height:9px}
.choice input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.c-name{flex:1;font-weight:600}
.c-price{color:var(--gold-hi);font-weight:700;font-size:14px}
.field{display:block;margin-top:18px}
.field>span{display:block;font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
html[lang=ar] .field>span{font-size:14px;text-transform:none}
.field input,.field textarea,.field select{width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2);outline:0;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold-hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);opacity:1}
.field.invalid input{border-color:var(--danger)}
.err{margin-top:12px;color:var(--danger);font-weight:700;font-size:14px}
.sheet-foot{flex:none;display:flex;gap:12px;align-items:center;padding:14px var(--pad) max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--sheet)}
.primary{flex:1;min-height:54px;padding:0 20px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;transition:background .2s}
html[lang=ar] .primary{font-size:16px;text-transform:none}
.primary:hover{background:var(--gold-hi)}
.primary:disabled,.primary[aria-disabled=true]{opacity:.45;pointer-events:none}
.primary svg{width:20px;height:20px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;height:54px;flex:none}
.stepper button{width:48px;height:100%;display:grid;place-items:center;color:var(--gold)}
.stepper button:disabled{opacity:.35}
.stepper svg{width:18px;height:18px}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm{height:46px}
.stepper.sm button{width:44px}
.link-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;color:var(--gold-hi);font-weight:700;font-size:14px;text-decoration:none}
.link-btn svg{width:18px;height:18px}
.link-btn.danger{color:var(--danger)}
.seg{display:flex;gap:6px;padding:4px;border:1px solid var(--line2);border-radius:999px;margin-top:18px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.seg button svg{width:18px;height:18px}
.seg button[aria-checked=true]{background:var(--gold);color:var(--gold-ink)}
.lines{margin-top:6px}
.cline{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cline .plate{width:52px;height:52px}
.cl-body{flex:1;min-width:0;display:grid;gap:2px}
.cl-body b{font:500 17px/1.25 var(--display)}
html[lang=ar] .cl-body b{font-family:var(--ar-display);font-weight:700;font-size:19px}
.cl-body small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.cl-body .cl-price{color:var(--gold-hi);font-weight:700;font-size:14px}
.upsell .pair{max-width:none}
.sum{margin-top:20px;border-top:1px solid var(--line2);padding-top:14px;display:grid;gap:8px}
.sum>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:14px}
.sum>div.total{color:var(--ink);font:500 24px var(--display);padding-top:6px}
html[lang=ar] .sum>div.total{font-family:var(--ar-display);font-weight:700;font-size:26px}
.sum .approx{font-size:12px;color:var(--faint)}
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.tips button{min-height:44px;border:1px solid var(--line2);border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.tips button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.hours li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.hours li.today{color:var(--gold-hi);font-weight:700}
.sel{user-select:all;-webkit-user-select:all}
.fine{font-size:12.5px;color:var(--faint);margin-top:14px}
.wifi{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;font-size:14px}
.rows{margin-top:12px;display:grid;gap:8px}
.rowbtn{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);text-align:start;width:100%}
.rowbtn[aria-checked=true]{border-color:var(--gold);background:var(--bg3)}
.rowbtn b{font:700 15px var(--body)}
.rowbtn small{color:var(--muted);font-size:12.5px;display:block}
.rowbtn .sym{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:700 15px var(--body);color:var(--gold);flex:none}
.rowbtn .tick{margin-inline-start:auto;color:var(--gold);width:22px;height:22px;opacity:0}
.rowbtn[aria-checked=true] .tick{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.dates{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad) * -1);padding:2px var(--pad) 6px}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;min-width:64px;padding:0 12px;min-height:78px;border:1px solid var(--line2);border-radius:16px;display:grid;place-items:center;align-content:center;gap:1px;color:var(--muted)}
.date small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.date b{font:500 24px/1.1 var(--display);color:var(--ink)}
.date em{font-style:normal;font-size:11px}
.date[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.date[aria-pressed=true] b{color:var(--gold-ink)}
.date:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:44px;border:1px solid var(--line2);border-radius:12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.slot[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.slot:disabled{opacity:.35}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.guests{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sent{text-align:center;padding:56px var(--pad) 28px}
.sent .tickc{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.sent .tickc svg{width:34px;height:34px}
.sent p{color:var(--muted);margin-top:10px}
.empty{display:grid;place-items:center;gap:14px;padding:30px 0;color:var(--muted);text-align:center}
.empty svg{width:44px;height:44px;color:var(--gold)}

/* ---------- toast ---------- */
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom));margin:0 auto;width:max-content;max-width:calc(100% - 40px);z-index:200;padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media (min-width:720px){
  .item{padding-top:24px}
  .name{font-size:23px}
  .brand .b2{font-size:104px}
  .sig{width:168px}
}
@media print{.dock,.toolbar,.hero-cta,.util{display:none}body{background:#fff;color:#000}}

const TH = T[HOUSE];

/* ------------------------------------------------------------------ data */
const cats = M.categories;
const items = [];
cats.forEach(c => c.items.forEach(it => { it.cat = c.id; items.push(it); }));
const byId = id => items.find(i => i.id === id);
const catOf = it => cats.find(c => c.id === it.cat);
const DIET_ORDER = ["veg","vegan","gf"];
const ALG_ORDER = ["gluten","milk","egg","nuts","sesame","soy"].filter(a => items.some(i => (i.allergens||[]).includes(a)));
const CUR = {TRY:{sym:"₺", dig:0}, USD:{sym:"$", dig:2}, EUR:{sym:"€", dig:2}, SAR:{sym:"SAR ", dig:2}};
const CUR_LIST = ["TRY"].concat(Object.keys(M.rates || {}).filter(c => CUR[c] && M.rates[c] > 0));

/* ------------------------------------------------------------------ state */
let lang = store.get("lang", M.defaultLang || "tr"); if (!T[lang]) lang = "tr";
let theme = store.get("theme", "night"); if (theme !== "day" && theme !== "night") theme = "night";
let cur = store.get("cur", "TRY"); if (!CUR_LIST.includes(cur)) cur = "TRY";
const _sf = store.get("favs", []);
let favs = new Set(Array.isArray(_sf) ? _sf.filter(id => typeof id === "string" && byId(id)) : []);
const filt = {fav:false, avail:false, diet:new Set(), excl:new Set()};
let query = "";
let orderType = "dine";
let tipPct = 0;

const t = k => T[lang][k];
const L = o => o ? (o[lang] || o.en || o.tr || "") : "";
const LH = o => o ? (o[HOUSE] || o.en || o.tr || "") : "";

/* ------------------------------------------------------------------ clock (demo-able) */
let clockOffset = 0;
(function(){
  if (!M.demo) return;
  const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(new URLSearchParams(location.search).get("time") || "");
  if (!m) return;
  const d = new Date();
  clockOffset = ((+m[1]*60 + +m[2]) - (d.getHours()*60 + d.getMinutes()))*60000 - d.getSeconds()*1000 - d.getMilliseconds();
})();
const now = () => new Date(Date.now() + clockOffset);
const toMin = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
const nowMin = () => { const n = now(); return n.getHours()*60 + n.getMinutes(); };

/* ------------------------------------------------------------------ money */
const locale = l => l === "tr" ? "tr-TR" : l === "ar" ? "ar-u-nu-latn" : "en-US";
function numFmt(v, digits, loc){ return new Intl.NumberFormat(loc, {minimumFractionDigits: digits, maximumFractionDigits: digits}).format(v); }
function fmt(n){                       // display currency, current language
  const c = CUR[cur], v = cur === "TRY" ? n : n * M.rates[cur];
  const digits = cur === "TRY" ? (Number.isInteger(n) ? 0 : 2) : c.dig;
  return c.sym + numFmt(v, digits, locale(lang));
}
const money = n => `<bdi class="m" dir="ltr">${esc(fmt(n))}</bdi>`;
const tl = n => numFmt(n, Number.isInteger(n) ? 0 : 2, locale(HOUSE)) + " ₺";   // plain TRY for WhatsApp, house language

/* ------------------------------------------------------------------ hours / availability */
function status(){
  const r = M.restaurant, n = now(), d = n.getDay(), mins = n.getHours()*60 + n.getMinutes();
  const today = r.hours[d], y = r.hours[(d+6)%7];
  if (y){ const o = toMin(y[0]), c = toMin(y[1]); if (c <= o && mins < c) return {open:true, text:`${t("closes")} ${y[1]}`}; }
  if (today){
    const o = toMin(today[0]); let c = toMin(today[1]); if (c <= o) c += 1440;
    if (mins >= o && mins < c) return {open:true, text:`${t("closes")} ${today[1]}`};
    if (mins < o) return {open:false, text:`${t("opens")} ${today[0]}`};
  }
  for (let i = 1; i <= 7; i++){ const nx = r.hours[(d+i)%7]; if (nx) return {open:false, text:`${t("opens")} ${i === 1 ? "" : T[lang].days[(d+i)%7] + " "}${nx[0]}`}; }
  return {open:false, text:""};
}
function inWindow(w, mins){ const o = toMin(w[0]); let c = toMin(w[1]); return c <= o ? (mins >= o || mins < c) : (mins >= o && mins < c); }
function avail(it){
  const w = it.serve || (catOf(it) || {}).serve;
  if (!w) return {ok:true, w:null};
  return {ok: inWindow(w, nowMin()), w};
}
const winText = w => `${w[0]}–${w[1]}`;
const winHtml = w => `<bdi dir="ltr">${winText(w)}</bdi>`;
function greetKey(){ const h = now().getHours(); return h >= 5 && h < 11 ? "gMorning" : h >= 11 && h < 17 ? "gDay" : h >= 17 && h < 22 ? "gEvening" : "gNight"; }

/* ------------------------------------------------------------------ helpers */
function norm(s){
  return String(s || "").toLocaleLowerCase("en").normalize("NFD").replace(/[\u0300-\u036f\u064b-\u065f\u0670]/g, "")
    .replace(/ı/g, "i").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
}
const hay = it => it._hay || (it._hay = norm(LANGS.map(l => [it.name, it.desc, it.notes].map(o => o && o[l] || "").join(" ")).join(" ")));
function plate(it, cls = ""){ return `<div class="plate ${cls}" style="--h:${+it.hue || 30}" aria-hidden="true">${I[it.icon] || I.plate}</div>`; }
const isFiltering = () => !!(query.trim() || filt.fav || filt.avail || filt.diet.size || filt.excl.size);
function matches(it){
  if (filt.fav && !favs.has(it.id)) return false;
  if (filt.avail && !avail(it).ok) return false;
  const tg = it.tags || [];
  for (const d of filt.diet){ if (d === "veg" ? !(tg.includes("veg") || tg.includes("vegan")) : !tg.includes(d)) return false; }
  for (const a of filt.excl){ if ((it.allergens || []).includes(a)) return false; }
  const q = norm(query.trim());
  if (q && !hay(it).includes(q)) return false;
  return true;
}

/* ------------------------------------------------------------------ item markup */
function badgesHtml(it){
  const tg = it.tags || [], out = [];
  if (it.sig) out.push(`<span class="lab sig-l">${I.t_sig}${esc(t("signature"))}</span>`);
  if (tg.includes("new")) out.push(`<span class="lab new-l">${esc(t("isNew"))}</span>`);
  if (tg.includes("vegan")) out.push(`<span class="dot-badge" title="${esc(T[lang].tags.vegan)}" aria-label="${esc(T[lang].tags.vegan)}">VG</span>`);
  else if (tg.includes("veg")) out.push(`<span class="dot-badge" title="${esc(T[lang].tags.veg)}" aria-label="${esc(T[lang].tags.veg)}">V</span>`);
  if (tg.includes("gf")) out.push(`<span class="dot-badge" title="${esc(T[lang].tags.gf)}" aria-label="${esc(T[lang].tags.gf)}">GF</span>`);
  if (tg.includes("spicy")) out.push(`<span class="dot-badge" title="${esc(T[lang].tags.spicy)}" aria-label="${esc(T[lang].tags.spicy)}">${I.t_spicy || "!"}</span>`);
  out.push(`<span class="av" data-avnote="${it.id}"></span>`);
  return out.join("");
}
const heartBtn = it => `<button type="button" class="heart" data-fav="${it.id}" aria-pressed="${favs.has(it.id)}" aria-label="${esc(favs.has(it.id) ? t("favRemove") : t("favAdd"))}: ${esc(L(it.name))}">${I.heart}</button>`;
function itemHtml(it){
  return `<article class="item" data-id="${it.id}" data-av="${it.id}">
    <div class="i-head"><h3 class="name"><button type="button" class="name-btn" data-id="${it.id}">${esc(L(it.name))}</button></h3><span class="leader" aria-hidden="true"></span><span class="price">${money(it.price)}</span></div>
    ${it.notes ? `<p class="i-notes">${esc(L(it.notes))}</p>` : ""}
    <p class="i-desc">${esc(L(it.desc))}</p>
    <div class="i-foot"><div class="badges">${it.soldOut ? `<span class="lab">${esc(t("soldOut"))}</span>` : ""}${badgesHtml(it)}</div>
      <div class="acts">${heartBtn(it)}<button type="button" class="add" data-quick="${it.id}" aria-label="${esc(t("add"))}: ${esc(L(it.name))}"${it.soldOut ? " disabled" : ""}>${I.plus}</button></div></div>
  </article>`;
}
function serveBadge(c){
  if (!c.serve) return "";
  return `<span class="serve" data-serve="${c.id}"><i></i><span></span></span>`;
}

/* ------------------------------------------------------------------ render */

function tickChrome(){

let _table = null;
function tableParam(){
  if (_table !== null) return _table;
  const v = new URLSearchParams(location.search).get("table") || "";
  _table = /^[A-Za-z0-9-]{1,6}$/.test(v) ? v : "";
  return _table;
}
function updateCounters(){
  const fc = $("#favCount"), xc = $("#filtCount");
  if (fc){ fc.hidden = favs.size === 0; fc.textContent = favs.size; }
  const n = filt.diet.size + filt.excl.size + (filt.avail ? 1 : 0);

function pickItem(){

function renderMenu(){
  const filtering = isFiltering();
  let html = "", count = 0;
  const lists = cats.map(c => ({c, list: c.items.filter(matches)}));
  lists.forEach(x => count += x.list.length);
  if (!filtering){
    const pk = pickItem();
    if (pk) html += `<section class="pick" data-id="${pk.id}" data-av="${pk.id}">
      ${plate(pk)}
      <div><span class="eyebrow">${esc(t("pickTitle"))}</span><h2><button type="button" class="name-btn" data-id="${pk.id}">${esc(L(pk.name))}</button></h2><p>${esc(L(pk.desc))}</p>
      <div class="pick-foot"><span class="price">${money(pk.price)}</span><span class="av" data-avnote="${pk.id}"></span></div></div></section>`;
    const sigs = items.filter(i => i.sig && !i.soldOut);
    if (sigs.length) html += `<section class="sigs"><h2 class="sec-title sm">${esc(t("sigTitle"))}</h2><div class="sig-row">${sigs.map(it => `
      <button type="button" class="sig" data-id="${it.id}" data-av="${it.id}">${plate(it)}<b>${esc(L(it.name))}</b><span class="price">${money(it.price)}</span></button>`).join("")}</div></section>`;
  } else {
    const chips = [];
    if (query.trim()) chips.push(["q", `“${query.trim()}”`]);
    if (filt.fav) chips.push(["fav", t("favs")]);
    filt.diet.forEach(d => chips.push(["diet:" + d, T[lang].tags[d]]));
    filt.excl.forEach(a => chips.push(["excl:" + a, "– " + T[lang].alg[a]]));
    if (filt.avail) chips.push(["avail", t("serving")]);
    html += `<div class="afbar"><div class="af-chips">${chips.map(([k, label]) => `<button type="button" class="af-chip" data-rm="${esc(k)}">${esc(label)}<span aria-hidden="true">${I.x}</span><span class="sr-only">${esc(t("close"))}</span></button>`).join("")}</div>
      <div class="af-meta"><span>${count} ${esc(t("results"))}</span><button type="button" class="link" data-clear>${esc(t("clearAll"))}</button></div></div>`;
  }
  lists.forEach(({c, list}) => {
    if (!list.length) return;
    html += `<section class="cat" id="cat-${c.id}" data-cat="${c.id}">
      <header class="cat-head"><div class="cat-ornament" aria-hidden="true"><i></i></div><h2 class="sec-title">${esc(L(c.name))}</h2>${c.note ? `<p class="cat-note">${esc(L(c.note))}</p>` : ""}${serveBadge(c)}</header>
      <div class="list">${list.map(itemHtml).join("")}</div></section>`;
  });
  if (!count) html += `<p class="none">${esc(filt.fav && favs.size === 0 && !query.trim() ? t("favEmpty") : t("noResults"))}</p>`;
  $("#menu").innerHTML = html;
  $("#live").textContent = filtering ? `${count} ${t("results")}` : "";
  patchAvail(); spy(); updateCounters();
}
/* in-place time-window patching (no re-render, so no scroll disturbance) */
function patchAvail(){
  $$("[data-av]").forEach(el => {
    const it = byId(el.dataset.av); if (!it) return;
    const a = avail(it);
    el.classList.toggle("off", !a.ok);
    const note = $("[data-avnote]", el);
    if (note) note.innerHTML = (!a.ok && a.w) ? `${esc(t("servFrom"))} ${winHtml(a.w)}` : "";
    const add = $(".add", el);
    if (add) add.disabled = !a.ok || !!it.soldOut;
  });
  $$("[data-serve]").forEach(el => {
    const c = cats.find(x => x.id === el.dataset.serve); if (!c || !c.serve) return;
    const ok = inWindow(c.serve, nowMin()) && status().open;   // "now serving" only while the café is actually open
    el.classList.toggle("off", !ok);
    el.lastElementChild.innerHTML = ok ? `${esc(t("serving"))} · ${winHtml(c.serve)}` : `${esc(t("servHours"))} ${winHtml(c.serve)}`;
  });
}

/* ------------------------------------------------------------------ cart */
function revalidate(l){
  const it = byId(l && l.id); if (!it || !Array.isArray(l.opts)) return false;
  if (!Number.isInteger(l.qty) || l.qty < 1) return false;
  l.qty = Math.min(l.qty, 30);
  const all = (it.options || []).flatMap(g => g.choices);
  for (const o of l.opts){
    const c = o && o.n && all.find(x => x.name.en === o.n.en); if (!c) return false;
    o.price = c.price || 0;
  }
  l.note = typeof l.note === "string" ? l.note.slice(0, 200) : "";
  l.key = l.id + "|" + l.opts.map(o => o.n.en).join(",") + "|" + l.note;
  return true;
}
let cart = store.get("cart", []);
if (!Array.isArray(cart) || Date.now() - store.get("cartTs", 0) > 12*3600e3) cart = [];
cart = cart.filter(revalidate);
const lineUnit = l => byId(l.id).price + l.opts.reduce((a, o) => a + o.price, 0);
const cartSub = () => cart.reduce((a, l) => a + lineUnit(l)*l.qty, 0);
const tipAmt = () => Math.round(cartSub()*tipPct/100);
const cartTotal = () => cartSub() + tipAmt();
const cartCount = () => cart.reduce((a, l) => a + l.qty, 0);
function saveCart(){ store.set("cart", cart); store.set("cartTs", Date.now()); renderCartBar(); }
function renderCartBar(){
  const n = cartCount(), bar = $("#cartBar");
  bar.hidden = n === 0;
  bar.innerHTML = `<span class="cb-count">${n}</span><span class="cb-label">${esc(t("viewOrder"))}</span><span class="cb-total">${money(cartSub())}</span>`;
  document.body.classList.toggle("has-cart", n > 0);
}
function addToCart(it, opts, qty, note){
  const key = it.id + "|" + opts.map(o => o.n.en).join(",") + "|" + note;
  const ex = cart.find(l => l.key === key);
  if (ex) ex.qty = Math.min(30, ex.qty + qty); else cart.push({key, id:it.id, opts, qty:Math.min(30, qty), note});
  saveCart(); toast(t("added"));
  const bar = $("#cartBar"); bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump");
}

/* ------------------------------------------------------------------ sheets */
let lastFocus = null, pushed = false, ignorePop = 0, returnToCart = false, tt;
let onClick = null, onInput = null, onChange = null;
function openSheet(html, cls = ""){
  const sheet = $("#sheet");
  clearTimeout(tt); $("#toast").classList.remove("show"); $("#toast").hidden = true;
  if (sheet.hidden) lastFocus = document.activeElement;
  onClick = onInput = onChange = null;
  $("#sheetBody").innerHTML = html;
  sheet.className = "sheet " + cls; sheet.hidden = false;
  $("#app").inert = true; $("#dock").inert = true;
  document.body.classList.add("locked");
  if (!pushed){ try { history.pushState({noorSheet:1}, ""); pushed = true; } catch(e){} }
  const sc = $(".sheet-scroll"); if (sc) sc.scrollTop = 0;
  const c = $("#sheetBody .close"); (c || $("#panel")).focus({preventScroll:true});
}
function closeSheet(fromPop){
  const sheet = $("#sheet"); if (sheet.hidden) return;
  sheet.hidden = true; sheet.className = "sheet"; $("#sheetBody").innerHTML = "";
  onClick = onInput = onChange = null;
  $("#app").inert = false; $("#dock").inert = false;
  document.body.classList.remove("locked");
  if (pushed){ pushed = false; if (!fromPop){ ignorePop++; try { history.back(); } catch(e){ ignorePop--; } } }
  returnToCart = false;
  const f = lastFocus; lastFocus = null;
  if (f && f.isConnected && typeof f.focus === "function") f.focus({preventScroll:true});
}
const closeBtn = () => `<button type="button" class="close" aria-label="${esc(t("close"))}">${I.x}</button>`;

/* ----- item sheet ----- */
function selectedOpts(it){
  const out = [];
  $$("#sheetBody fieldset.opt").forEach(fs => {
    const g = it.options[+fs.dataset.g];
    $$("input:checked", fs).forEach(inp => { const c = g.choices[+inp.value]; out.push({g:g.name, n:c.name, price:c.price || 0}); });
  });
  return out;
}
function metersHtml(it){
  const m = it.meters; if (!m) return "";
  const rows = Object.keys(m).filter(k => T[lang].meters[k]).map(k => {
    const v = Math.max(0, Math.min(5, +m[k] || 0));
    return `<div class="meter" role="img" aria-label="${esc(T[lang].meters[k])} ${v}${t("of5")}"><span>${esc(T[lang].meters[k])}</span><span class="dots" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${i <= v ? "on" : ""}"></i>`).join("")}</span></div>`;
  });
  return rows.length ? `<div class="meters">${rows.join("")}</div>` : "";
}
function openItem(id){
  const it = byId(id); if (!it) return;
  const a = avail(it), c = catOf(it);
  let qty = 1;
  const groups = (it.options || []).map((g, gi) => `
    <fieldset class="opt" data-g="${gi}"><legend>${esc(L(g.name))}<small>${esc(g.type === "single" ? t("required") : t("optional"))}</small></legend>
    ${g.choices.map((ch, ci) => `<label class="choice"><input type="${g.type === "single" ? "radio" : "checkbox"}" name="g${gi}" value="${ci}"${g.type === "single" && ci === 0 ? " checked" : ""}><span class="c-name">${esc(L(ch.name))}</span><span class="c-price">${ch.price ? "+" + money(ch.price) : ""}</span></label>`).join("")}</fieldset>`).join("");

  if (it.prep) facts.push(`<span class="fact">${I.clock}${it.prep} ${esc(t("min"))}</span>`);
  if (it.kcal) facts.push(`<span class="fact"><bdi dir="ltr">${it.kcal} kcal</bdi></span>`);

  const pairs = (it.pair || []).map(byId).filter(p => p && !p.soldOut);

      <div class="plate-wrap">${plate(it)}</div>

        <p class="eyebrow">${esc(L(c.name))}${it.sig ? " · ✦ " + esc(t("signature")) : ""}</p>

        ${(it.allergens || []).length ? `<p class="alg"><b>${esc(t("allergens"))}:</b> ${it.allergens.map(x => esc(T[lang].alg[x] || x)).join(", ")}</p>` : ""}
        ${canAdd ? `${groups}<label class="field"><span>${esc(t("itemNote"))}</span><textarea id="itemNote" rows="2" maxlength="200" placeholder="${esc(t("notePh"))}"></textarea></label>` : ""}
      </div>
    </div>
    <div class="sheet-foot">
      ${canAdd ? `<div class="stepper"><button type="button" data-step="-1" aria-label="−" disabled>${I.minus}</button><output id="qty" aria-live="polite">1</output><button type="button" data-step="1" aria-label="+">${I.plus}</button></div>` : ""}
      <button type="button" class="primary" id="addItem"${canAdd ? "" : " disabled"}><span>${addLabel}${canAdd ? ` · <span id="itemTotal">${money(it.price)}</span>` : ""}</span></button>

  const recalc = () => {
    const tot = $("#itemTotal"); if (!tot) return;
    tot.innerHTML = money((it.price + selectedOpts(it).reduce((s, o) => s + o.price, 0))*qty);

    const s = e.target.closest("[data-step]");

function shareItem(it){
  const url = location.href.split("#")[0] + "#i=" + it.id;
  const data = {title: `${M.restaurant.name} · ${L(it.name)}`, text: L(it.desc), url};
  if (navigator.share){ navigator.share(data).catch(() => {}); return; }
  copy(url, t("linkCopied"));
}

/* ----- favourites ----- */
function toggleFav(id){
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  store.set("favs", [...favs]);
  $$(`[data-fav="${id}"]`).forEach(b => {
    const on = favs.has(id), it = byId(id);
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", `${on ? t("favRemove") : t("favAdd")}: ${L(it.name)}`);
  });
  updateCounters();
  if (filt.fav) renderMenu();
}

/* ----- cart sheet ----- */
function orderText(){
  const r = M.restaurant;
  const tblV = ($("#tableNo") && $("#tableNo").value.trim()) || "-";
  const nameV = ($("#custName") && $("#custName").value.trim()) || "-";
  let s = `*${TH.orderTitle} · ${r.name}*\n`;
  s += orderType === "dine" ? `${TH.typeLbl}: ${TH.dineIn} · ${TH.tableLblMsg} ${tblV}\n` : `${TH.typeLbl}: ${TH.takeaway} · ${nameV}\n`;
  s += "\n";
  cart.forEach(l => {
    const it = byId(l.id);
    s += `${l.qty} × ${LH(it.name)} — ${tl(lineUnit(l)*l.qty)}\n`;
    if (l.opts.length) s += `   ${l.opts.map(o => LH(o.n)).join(", ")}\n`;
    if (l.note) s += `   ✎ ${l.note}\n`;
  });
  const nt = ($("#orderNote") && $("#orderNote").value.trim()) || "";
  if (nt) s += `\n${TH.noteLbl}: ${nt}\n`;
  if (tipPct) s += `\n${TH.tip}: %${tipPct} · ${tl(tipAmt())}`;
  s += `\n\n*${TH.total}: ${tl(cartTotal())}*`;
  return s;
}

/* ----- reservation ----- */
function dayStart(d){ const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function slotsFor(date){
  const h = M.restaurant.hours[date.getDay()]; if (!h) return [];
  const o = toMin(h[0]); let c = toMin(h[1]); if (c <= o) c += 1440;
  const last = c - (M.restaurant.lastSeatingMins ?? 30), out = [];
  for (let m = o; m <= last; m += 30) out.push(m);
  return out;
}
const slotTime = (date, m) => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m, 0, 0);
const icsDate = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function buildIcs(date, m, guests, name){
  const s = slotTime(date, m), e = new Date(s.getTime() + 90*60000), st = new Date();
  const stamp = `${st.getUTCFullYear()}${String(st.getUTCMonth()+1).padStart(2,"0")}${String(st.getUTCDate()).padStart(2,"0")}T${String(st.getUTCHours()).padStart(2,"0")}${String(st.getUTCMinutes()).padStart(2,"0")}${String(st.getUTCSeconds()).padStart(2,"0")}Z`;
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Maison Noor//Menu//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:noor-${s.getTime()}-${guests}@maison-noor`, `DTSTAMP:${stamp}`, `DTSTART:${icsDate(s)}`, `DTEND:${icsDate(e)}`,
    `SUMMARY:${icsEsc(`${M.restaurant.name} · ${guests} ${TH.guests}`)}`, `LOCATION:${icsEsc(M.restaurant.address)}`,
    `DESCRIPTION:${icsEsc(`${TH.rMsg}: ${name}`)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n") + "\r\n";
}
function downloadIcs(text){
  const blob = new Blob([text], {type:"text/calendar;charset=utf-8"}), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "maison-noor-reservation.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

    <label class="field"><span>${esc(t("rNote"))}</span><textarea id="rNote" rows="2" maxlength="300"></textarea></label>

  const fail = (msg, el) => {

/* ------------------------------------------------------------------ utils */
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.hidden = false; void el.offsetWidth; el.classList.add("show");
  const lv = $("#live"); lv.textContent = ""; setTimeout(() => { lv.textContent = msg; }, 60);   // screen readers get the message via the live region
  clearTimeout(tt); tt = setTimeout(() => { el.classList.remove("show"); setTimeout(() => { if (!el.classList.contains("show")) el.hidden = true; }, 250); }, 1700);
}
function copy(text, msg){
  const done = () => toast(msg || t("copied"));
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e){} ta.remove(); done(); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
}

/* ------------------------------------------------------------------ scrollspy (never scrolls the page) */
let io, activeCat = null;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function setActiveCat(id){
  if (id === activeCat) return;
  activeCat = id;
  const nav = $("#cats");
  $$("button", nav).forEach(b => {
    const on = b.dataset.cat === id;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    if (on){
      const br = b.getBoundingClientRect(), nr = nav.getBoundingClientRect();
      const dx = (br.left + br.width/2) - (nr.left + nr.width/2);
      if (Math.abs(dx) > 4) nav.scrollBy({left: dx, behavior: reduced() ? "auto" : "smooth"});
    }
  });
}
function spy(){
  io && io.disconnect();
  const tb = $("#toolbar").offsetHeight;
  document.documentElement.style.setProperty("--tb", tb + "px");
  const secs = $$("section.cat");
  if (!secs.length){ activeCat = null; $$("#cats button").forEach(b => b.classList.remove("on")); return; }
  io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setActiveCat(e.target.dataset.cat); }); }, {rootMargin: `-${tb + 10}px 0px -70% 0px`});
  secs.forEach(s => io.observe(s));
}

/* ------------------------------------------------------------------ events */
function bind(){
  $(".lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.lang; store.set("lang", lang); renderChrome(); renderMenu(); renderCartBar(); });
  $("#themeBtn").addEventListener("click", () => { theme = theme === "night" ? "day" : "night"; store.set("theme", theme); renderChrome(); });
  $("#curBtn").addEventListener("click", openCurrency);
  $("#q").addEventListener("input", e => { query = e.target.value; renderMenu(); });
  $("#favBtn").addEventListener("click", () => { filt.fav = !filt.fav; renderMenu(); });
  $("#filterBtn").addEventListener("click", openFilters);
  $("#reserveBtn").addEventListener("click", openReserve);
  $("#reserveBar").addEventListener("click", openReserve);
  $("#infoBtn").addEventListener("click", openInfo);
  $("#waiterBtn").addEventListener("click", openWaiter);
  $("#cartBar").addEventListener("click", openCart);
  $("#cats").addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    if (isFiltering()){ query = ""; $("#q").value = ""; filt.fav = false; filt.avail = false; filt.diet.clear(); filt.excl.clear(); renderMenu(); }
    const s = $("#cat-" + b.dataset.cat); if (s) s.scrollIntoView({behavior: reduced() ? "auto" : "smooth", block: "start"});
  });
  $("#menu").addEventListener("click", e => {
    const rm = e.target.closest("[data-rm]");
    if (rm){
      const [k, v] = rm.dataset.rm.split(":");
      if (k === "q"){ query = ""; $("#q").value = ""; } else if (k === "fav") filt.fav = false; else if (k === "avail") filt.avail = false;
      else if (k === "diet") filt.diet.delete(v); else if (k === "excl") filt.excl.delete(v);
      renderMenu(); return;
    }
    if (e.target.closest("[data-clear]")){ query = ""; $("#q").value = ""; filt.fav = false; filt.avail = false; filt.diet.clear(); filt.excl.clear(); renderMenu(); return; }
    const hb = e.target.closest("[data-fav]"); if (hb){ e.stopPropagation(); toggleFav(hb.dataset.fav); return; }
    const q = e.target.closest("[data-quick]");
    if (q){
      e.stopPropagation();
      const it = byId(q.dataset.quick);
      if (it.options && it.options.length) openItem(it.id); else if (avail(it).ok) addToCart(it, [], 1, "");
      return;
    }
    const c = e.target.closest("[data-id]"); if (c) openItem(c.dataset.id);
  });
  $("#sheetBody").addEventListener("click", e => { if (e.target.closest(".close")) { closeSheet(); return; } onClick && onClick(e); });
  $("#sheetBody").addEventListener("input", e => onInput && onInput(e));
  $("#sheetBody").addEventListener("change", e => onChange && onChange(e));
  $("#sheetBg").addEventListener("click", () => closeSheet());
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
  addEventListener("popstate", () => {
    if (ignorePop > 0){ ignorePop--; return; }
    if (!$("#sheet").hidden){ pushed = false; closeSheet(true); }
  });
  let lastW = innerWidth, rt;
  addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(spy, 150); });
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
  addEventListener("appinstalled", () => { deferredInstall = null; });
  let sig = "";
  setInterval(() => {
    tickChrome();
    const s = items.map(i => avail(i).ok ? 1 : 0).join("") + cats.map(c => c.serve && inWindow(c.serve, nowMin()) ? 1 : 0).join("") + greetKey() + status().text;
    if (s !== sig){ sig = s; patchAvail(); }
  }, 30000);
}

/* ------------------------------------------------------------------ boot */
renderChrome(); renderMenu(); renderCartBar(); bind();
function deepLink(){
  const h = location.hash;
  let m;
  if ((m = /^#i=([\w-]+)$/.exec(h)) && byId(m[1])) openItem(m[1]);
  else if (h === "#cart") openCart();
  else if (h === "#reserve") openReserve();
  else if (h === "#info") openInfo();
}
deepLink();
addEventListener("hashchange", deepLink);
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
})();

</script>
