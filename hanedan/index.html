<style>
/* Hanedan — fine dining: bottle green & brass, text-led menu like a printed carte */
:root{color-scheme:dark;
 --bg:#0f1d18;--surface:#15261f;--surface2:#1d3229;--ink:#efe8d8;--muted:#a9ad9c;--line:#27392f;
 --accent:#c9a467;--accent-ink:#13201a;--price:#d8b878;--ok:#8fcf9f;--bad:#e2856e;--radius:4px;
 --ts:28%;--tl:20%;--tis:55%;--til:68%;
 --bn-bg:#1a2e25;--bn-ink:#efe8d8;--bn-eye:#d8b878;--bn-art:#d8b878;--bn-glow:#c9a46733;
 --font-d:"Cormorant Garamond",Garamond,"Times New Roman",serif;--font-b:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;--font-ar:"IBM Plex Sans Arabic",Tahoma,sans-serif}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tb,120px) + 4px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0}
html[dir=rtl] body{font-family:var(--font-ar)}
html[dir=rtl] .name,html[dir=rtl] .sheet-title,html[dir=rtl] .sec-title{font-family:var(--font-ar);letter-spacing:0;text-transform:none}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block;width:100%;height:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:110px;min-height:100%}
.hero{padding:20px 16px 14px;display:grid;gap:10px}
.hero-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;flex:none}
.brand-name{font-family:var(--font-d);margin:0;line-height:1;font-size:26px;overflow-wrap:anywhere}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none;background:var(--surface)}
.lang button{font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 9px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tagline{margin:0;color:var(--muted);max-width:42ch}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.status.is-open i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.status em{font-style:normal;color:var(--muted);font-weight:500}
.pill-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill-btn svg{width:16px;height:16px}
/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 16px 0;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font-size:16px;padding:11px 14px;padding-inline-start:38px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 8px}
.cats::-webkit-scrollbar,.pop-row::-webkit-scrollbar,#filters::-webkit-scrollbar{display:none}
.cats button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);flex:none}
.cats button svg{width:20px;height:20px;stroke-width:2.6}
.cats button.on{background:var(--accent);color:var(--accent-ink)}
#filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.chip svg{width:14px;height:14px}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* menu */
main{padding:0 16px}
.sec-title{font-family:var(--font-d);margin:0;font-size:22px;line-height:1.15;text-wrap:balance}
.popular{padding-top:18px}
.pop-row{display:flex;gap:10px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.pop{flex:none;width:136px;display:grid;gap:4px;text-align:start;scroll-snap-align:start}
.pop-thumb{aspect-ratio:1;max-width:100%;border-radius:var(--radius);display:grid;place-items:center;padding:24%;background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--tis) var(--til));overflow:hidden}
.pop-name{font-weight:700;font-size:14px;line-height:1.2}
.pop-price{font-size:13px;color:var(--price);font-weight:700;font-variant-numeric:tabular-nums}
.cat{padding-top:26px}
.cat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cat-ico{width:28px;height:28px;color:var(--accent);flex:none}
.cat-note{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.list{display:grid}
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item .thumb{grid-column:2;grid-row:1;width:92px;aspect-ratio:1;border-radius:var(--radius);display:grid;place-items:center;padding:20px;background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--tis) var(--til));overflow:hidden}
.thumb img,.pop-thumb img,.sheet-thumb img,.cl-thumb img{width:100%;height:100%;object-fit:cover}
.item .body{grid-column:1;grid-row:1;min-width:0;display:grid;gap:4px}
.line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{margin:0;font-size:16.5px;line-height:1.25;font-weight:700}
.leader{display:none}
.name-btn{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;line-height:inherit;text-align:inherit;display:inline;background:none;border:0;padding:0;margin:0;cursor:pointer}
.name-btn::after{content:"";position:absolute;inset:0;z-index:1}
.name-btn:focus-visible{outline:none}
.item:has(.name-btn:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.banner:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a.tel{color:inherit;text-decoration:underline;text-underline-offset:3px}
.price{font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-weight:500;opacity:.7;margin-inline-end:1px}
.desc{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag svg{width:12px;height:12px}
.tag-popular{color:color-mix(in srgb,var(--accent) 68%,var(--ink));background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tag-new{color:color-mix(in srgb,#b7791f 65%,var(--ink));background:color-mix(in srgb,#e8a33d 18%,transparent)}
.tag-vegan,.tag-veg,.tag-gf{color:color-mix(in srgb,var(--ok) 66%,var(--ink));background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag-spicy{color:color-mix(in srgb,var(--bad) 66%,var(--ink));background:color-mix(in srgb,var(--bad) 13%,transparent)}
.tag-sold{color:var(--bg);background:var(--ink)}
.item.sold .thumb{opacity:.45;filter:grayscale(1)}
.item.sold .price{text-decoration:line-through;text-decoration-thickness:1.5px}
.item.sold .name-btn{color:var(--muted)}
.add{z-index:2;position:absolute;inset-inline-end:-6px;bottom:6px;width:34px;height:34px;padding:8px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px rgb(0 0 0/.18);transition:transform .15s}
.add:active{transform:scale(.9)}
.none{padding:40px 0;text-align:center;color:var(--muted)}
.foot{padding:30px 16px 0;color:var(--muted);font-size:12.5px;display:grid;gap:4px;text-align:center}
.foot .demo{font-weight:600}
/* floating */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;pointer-events:none}
.dock>*{pointer-events:auto}
.waiter{display:inline-flex;align-items:center;gap:7px;padding:0 16px;height:52px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;box-shadow:0 6px 20px rgb(0 0 0/.14);flex:none}
.waiter svg{width:19px;height:19px}
.cartbar{flex:1;max-width:400px;height:52px;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.cb-count{min-width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);font-variant-numeric:tabular-nums}
.cb-label{flex:1;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-total{white-space:nowrap}
body.has-cart .waiter{width:52px;padding:0;justify-content:center}
body.has-cart .waiter span{display:none}
.cb-total{padding-inline-end:12px;font-variant-numeric:tabular-nums}
.cartbar.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.04)}}
body:not(.has-cart) .dock{justify-content:flex-end}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgb(10 10 12/.5);animation:fade .2s}
.panel{outline:none;overscroll-behavior:contain;position:relative;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#sheetBody{overscroll-behavior:contain;overflow-y:auto;display:flex;flex-direction:column;min-height:0;flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.close{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:36px;height:36px;padding:8px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.sheet-thumb{aspect-ratio:16/10;max-width:100%;flex:none;display:grid;place-items:center;padding:10% 32%;background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--tis) var(--til))}
.sheet-pad{padding:20px 18px 16px;display:grid;gap:12px}
.item-sheet .sheet-pad{padding-top:16px}
.sheet-title{font-family:var(--font-d);font-size:24px;margin:0;line-height:1.15;padding-inline-end:40px}
.sheet-desc{margin:0;color:var(--muted)}
.alg{margin:0;font-size:13px;color:var(--muted)}
.opt{border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px 6px;margin:0;display:grid}
.opt legend{font-weight:700;padding:0 6px;display:flex;gap:8px;align-items:baseline}
.opt legend small{font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.choice{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.choice:last-child{border-bottom:0}
.choice input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.c-name{flex:1}
.c-price{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{font-size:16px;font-weight:500;color:var(--ink);padding:11px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);resize:vertical;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.sheet-foot{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);margin-top:auto}
.primary{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;text-align:center}
.primary svg{width:20px;height:20px;flex:none}
.primary[disabled]{opacity:.5}
.primary.wa{background:#167a43;color:#fff}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;flex:none}
.stepper button{width:44px;height:48px;padding:14px}
.stepper output{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm button{width:34px;height:34px;padding:9px}
.lines{list-style:none;margin:0;padding:0;display:grid}
.cline{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl-thumb{width:52px;height:52px;flex:none;border-radius:calc(var(--radius) * .7);display:grid;place-items:center;padding:12px;background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--tis) var(--til));overflow:hidden}
.cl-body{flex:1;min-width:0;display:grid;gap:1px}
.cl-body small{color:var(--muted);font-size:12.5px}
.cl-note{font-style:italic}
.cl-price{font-weight:700;color:var(--price);font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}
.seg.three{grid-template-columns:repeat(3,1fr);border-radius:calc(var(--radius) + 4px)}
.seg button{padding:9px 6px;border-radius:999px;font-weight:600;font-size:14px;color:color-mix(in srgb,var(--muted) 78%,var(--ink));display:flex;align-items:center;justify-content:center;gap:6px}
.seg.three button{flex-direction:column;border-radius:var(--radius);font-size:13px}
.seg.three svg{width:22px;height:22px}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0/.12)}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;padding-top:4px}
.sum b{font-size:22px;color:var(--price);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--bad);font-weight:600;font-size:13.5px}
.link-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--accent);text-decoration:none;justify-self:start}
.link-btn svg{width:17px;height:17px}
.link-btn.danger{color:var(--muted)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--muted);padding:30px 0}
.empty svg{width:44px;height:44px}
.sub{display:flex;align-items:center;gap:7px;font-size:14px;margin:6px 0 -4px}
.sub svg{width:17px;height:17px;color:var(--accent)}
.hours{list-style:none;margin:0;padding:0;display:grid;font-size:14px}
.hours li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.hours li.today{font-weight:700;color:var(--accent)}
.sel{margin:0;user-select:all}
.wifi{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:22px;max-height:86%}}
/* cover banner */
.banner{position:relative;margin-top:16px;border-radius:calc(var(--radius) + 6px);overflow:hidden;min-height:196px;display:grid;grid-template-columns:minmax(0,1fr) 40%;background:var(--bn-bg);color:var(--bn-ink);cursor:pointer;isolation:isolate}
.bn-art{grid-column:2;grid-row:1;display:grid;place-items:center;padding:14% 16%;color:var(--bn-art);background:radial-gradient(circle at 60% 50%,var(--bn-glow),transparent 70%)}
.bn-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bn-text{grid-column:1;grid-row:1;padding:20px 0 20px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
html[dir=rtl] .bn-text{padding:20px 20px 20px 0}
.bn-eye{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bn-eye)}
.bn-title{font-family:var(--font-d);font-size:25px;line-height:1.08;margin:0;text-wrap:balance}
html[dir=rtl] .bn-title{font-family:var(--font-ar)}
.bn-desc{margin:0;font-size:13.5px;opacity:.85}
.bn-cta{margin-top:auto;display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--bn-eye);color:var(--bn-bg);font-weight:700;font-variant-numeric:tabular-nums}
html[dir=rtl] .bn-cta{padding:6px 14px 6px 6px}
.bn-cta i{width:26px;height:26px;padding:5px;border-radius:50%;background:var(--bn-bg);color:var(--bn-eye)}


.hero{padding-top:34px;padding-bottom:22px;text-align:center;justify-items:center}
.hero-top{flex-direction:column;gap:16px}
.brand{flex-direction:column;gap:10px}
.logo{width:50px;height:50px}
.brand-name{font-size:48px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding-inline-start:.18em}
html[dir=rtl] .brand-name{font-family:var(--font-d);letter-spacing:.18em;text-transform:uppercase}
.tagline{font-family:var(--font-d);font-style:italic;font-size:19px;text-align:center}
.meta{justify-content:center}
.lang,.status,.pill-btn{background:transparent;border-color:var(--line)}
.banner{border:1px solid #c9a46755;border-radius:var(--radius)}
.bn-title{font-weight:600;font-size:28px}
.toolbar{border-bottom-color:#c9a46740}
.cats button{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:500}
.cats button.on{background:transparent;color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.cat{padding-top:36px}
.cat-head{flex-direction:column;justify-content:center;text-align:center;gap:6px;margin-bottom:8px}
.cat-ico{display:none}
.sec-title{font-weight:500;font-size:clamp(20px,6.8vw,30px);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--accent)}

  bar.innerHTML = `<span class="cb-count">${n}</span><span class="cb-label">${t("viewCart")}</span><span class="cb-total">${money(sum)}</span>`;
  document.body.classList.toggle("has-cart", n>0);
}
const lineUnit = l => { const it = byId(l.id); return it.price + l.opts.reduce((a,o)=>a+o.price,0); };
const cartTotal = () => cart.reduce((a,l)=>a+lineUnit(l)*l.qty,0);
function saveCart(){ store.set("cart", cart); store.set("cartTs", Date.now()); renderCartBar(); }

/* ---------- sheet ---------- */
let lastFocus = null, pushed = false, ignorePop = 0;
function openSheet(html, cls=""){
  const sheet = $("#sheet");
  clearTimeout(tt); $("#toast").classList.remove("show"); $("#toast").hidden = true;
  if (sheet.hidden) lastFocus = document.activeElement;
  const sb = $("#sheetBody"); sb.onclick = sb.oninput = sb.onchange = null;
  sb.innerHTML = html;
  sheet.className = "sheet open " + cls;
  sheet.hidden = false;
  $(".app").inert = true; $(".dock").inert = true;
  document.body.classList.add("locked");
  if (!pushed){ try { history.pushState({sheet:1}, ""); pushed = true; } catch(e){} }
  const c = $("#sheetBody .close"); (c || $("#panel")).focus({preventScroll:true});
}
function closeSheet(fromPop){
  const sheet = $("#sheet"); if (sheet.hidden) return;
  sheet.hidden = true; sheet.className = "sheet";
  $(".app").inert = false; $(".dock").inert = false;
  document.body.classList.remove("locked");
  if (pushed){ pushed = false; if (!fromPop){ ignorePop++; try { history.back(); } catch(e){ ignorePop--; } } }
  const f = lastFocus; lastFocus = null;
  if (f && f.isConnected && typeof f.focus === "function") f.focus({preventScroll:true});
}
const closeBtn = () => `<button class="close" aria-label="${t("close")}">${I.x}</button>`;

function openItem(id){
  const it = byId(id); if (!it) return;
  const groups = (it.options||[]).map((g,gi)=>`
    <fieldset class="opt" data-g="${gi}">
      <legend>${esc(L(g.name))}<small>${g.type==="single"?t("required"):t("optional")}</small></legend>
      ${g.choices.map((c,ci)=>`<label class="choice"><input type="${g.type==="single"?"radio":"checkbox"}" name="g${gi}" value="${ci}" ${g.type==="single"&&ci===0?"checked":""}><span class="c-name">${esc(L(c.name))}</span><span class="c-price">${c.price?("+"+money(c.price)):""}</span></label>`).join("")}
    </fieldset>`).join("");
  openSheet(`${closeBtn()}
    ${thumb(it,"sheet-thumb")}
    <div class="sheet-pad">
      <h2 class="sheet-title" id="sheetTitle">${esc(L(it.name))}</h2>
      <p class="sheet-desc">${esc(L(it.desc))}</p>
      <div class="tags">${tagsHtml(it)}${it.prep?`<span class="tag tag-kcal">${I.clock}${it.prep} ${t("min")}</span>`:""}</div>
      ${(it.allergens||[]).length?`<p class="alg"><b>${t("allergens")}:</b> ${it.allergens.map(a=>esc(T[lang].alg[a])).join(", ")}</p>`:""}
      ${groups}
      <label class="field"><span>${t("itemNote")}</span><textarea id="itemNote" rows="2" placeholder="${esc(t("notePh"))}"></textarea></label>
    </div>
    ${it.soldOut?`<div class="sheet-foot"><button class="primary" disabled>${t("soldOut")}</button></div>`:`
    <div class="sheet-foot">
      <div class="stepper"><button type="button" data-step="-1" aria-label="${t("dec")}">${I.minus}</button><output id="qty" aria-live="polite">1</output><button type="button" data-step="1" aria-label="${t("inc")}">${I.plus}</button></div>
      <button class="primary" id="addItem" data-id="${it.id}">${t("addToCart")} · <span id="itemTotal">${money(it.price)}</span></button>
    </div>`}`, "item-sheet");
  const recalc = () => {
    const qty = +$("#qty").value;
    $("#itemTotal") && ($("#itemTotal").textContent = money((it.price + selectedOpts(it).reduce((a,o)=>a+o.price,0))*qty));
  };
  $("#sheetBody").onchange = recalc; $("#sheetBody").oninput = null;
  $("#qty") && ($("#qty").value = 1);
  $("#sheetBody").onclick = e => {
    const s = e.target.closest("[data-step]");
    if (s){ const q = Math.max(1, Math.min(MAXQ, +$("#qty").value + +s.dataset.step)); $("#qty").value = q; recalc(); }
    if (e.target.closest("#addItem")){
      addToCart(it, selectedOpts(it), +$("#qty").value, $("#itemNote").value.trim());
      closeSheet();
    }
  };
}
function selectedOpts(it){
  const out = [];
  $$("#sheetBody fieldset.opt").forEach(fs => {
    const g = it.options[+fs.dataset.g];
    $$("input:checked", fs).forEach(inp => { const c = g.choices[+inp.value]; out.push({g:g.name, n:c.name, price:c.price||0}); });
  });
  return out;
}
function addToCart(it, opts, qty, note){
  const key = it.id + "|" + opts.map(o=>o.n.en).join(",") + "|" + note;
  const ex = cart.find(l => l.key === key);
  if (ex) ex.qty = Math.min(MAXQ, ex.qty + qty); else cart.push({key, id:it.id, opts, qty:Math.min(MAXQ, qty), note});
  saveCart(); toast(t("added"));
  const bar = $("#cartBar"); bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump");
}

function orderText(){
  const r = M.restaurant;
  let s = `*${th("orderTitle")} · ${r.name}*\n`;
  s += orderType==="dine" ? `${th("orderType")}: ${th("dineIn")} · ${th("table")} ${(draft.table !== null ? draft.table : curTable()).trim()||"-"}\n` : `${th("orderType")}: ${th("takeaway")} · ${draft.name.trim()||"-"}\n`;
  s += `\n`;
  cart.forEach(l => {
    const it = byId(l.id);
    s += `${l.qty} × ${LH(it.name)} — ${moneyPlain(lineUnit(l)*l.qty)}\n`;
    if (l.opts.length) s += `   ${l.opts.map(o=>LH(o.n)).join(", ")}\n`;
    if (l.note) s += `   ✎ ${l.note}\n`;
  });
  const n = draft.note.trim();
  if (n) s += `\n${th("note")}: ${n}\n`;
  s += `\n*${th("total")}: ${moneyPlain(cartTotal())}*`;
  return s;
}
const waUrl = text => `https://wa.me/${M.whatsapp}?text=${encodeURIComponent(text)}`;

function openCart(){
  if (!cart.length){ openSheet(`${closeBtn()}<div class="sheet-pad"><h2 class="sheet-title" id="sheetTitle">${t("cart")}</h2><p class="empty">${I.bag}${t("empty")}</p></div>`, "cart-sheet"); return; }
  const tbl = curTable();
  openSheet(`${closeBtn()}
    <div class="sheet-pad">
      <h2 class="sheet-title" id="sheetTitle">${t("cart")}</h2>
      <ul class="lines">${cart.map((l,i)=>{ const it = byId(l.id); return `
        <li class="cline">${thumb(it,"cl-thumb")}
          <div class="cl-body"><b>${esc(L(it.name))}</b>${l.opts.length?`<small>${l.opts.map(o=>esc(L(o.n))).join(", ")}</small>`:""}${l.note?`<small class="cl-note">${esc(l.note)}</small>`:""}
          <span class="cl-price">${money(lineUnit(l)*l.qty)}</span></div>
          <div class="stepper sm"><button type="button" data-line="${i}" data-d="-1" aria-label="${l.qty===1?t("remove"):t("dec")}: ${esc(L(it.name))}">${l.qty===1?I.trash:I.minus}</button><output>${l.qty}</output><button type="button" data-line="${i}" data-d="1" aria-label="${t("inc")}: ${esc(L(it.name))}">${I.plus}</button></div>
        </li>`;}).join("")}</ul>
      <div class="seg" role="radiogroup">
        <button type="button" role="radio" data-type="dine" aria-checked="${orderType==="dine"}">${t("dineIn")}</button>
        <button type="button" role="radio" data-type="take" aria-checked="${orderType==="take"}">${t("takeaway")}</button>
      </div>
      ${orderType==="dine"?`<label class="field"><span>${t("table")}</span><input id="tableNo" maxlength="6" autocomplete="off" value="${esc(tbl)}" placeholder="12"></label>`
      :`<label class="field"><span>${t("yourName")}</span><input id="custName" maxlength="40" autocomplete="given-name" value="${esc(draft.name)}"></label>`}
      <label class="field"><span>${t("note")}</span><textarea id="orderNote" rows="2" maxlength="300" placeholder="${esc(t("notePh"))}">${esc(draft.note)}</textarea></label>
      <div class="sum"><span>${t("total")}</span><b>${money(cartTotal())}</b></div>
      <p class="err" id="err" role="alert" hidden></p>
      <button type="button" class="link-btn" id="copyOrder">${I.copy}${t("copy")}</button>
      <button type="button" class="link-btn danger" id="clearCart">${I.trash}${t("clear")}</button>
    </div>
    <div class="sheet-foot"><a class="primary wa" id="sendWa" href="#" target="_blank" rel="noopener">${I.wa}${t("send")}</a></div>`, "cart-sheet");
  const upd = () => { $("#sendWa").href = waUrl(orderText()); };
  upd();
  $("#sheetBody").oninput = e => { if (e.target.id==="tableNo") saveTable(e.target.value); else if (e.target.id==="custName") draft.name = e.target.value; else if (e.target.id==="orderNote") draft.note = e.target.value; upd(); };
  $("#sheetBody").onclick = e => {
    const b = e.target.closest("[data-line]");
    if (b){ const l = cart[+b.dataset.line]; if (!l) return; l.qty = Math.min(MAXQ, l.qty + +b.dataset.d); if (l.qty<=0) cart.splice(+b.dataset.line,1); saveCart(); openCart(); return; }
    const ty = e.target.closest("[data-type]");
    if (ty){ orderType = ty.dataset.type; openCart(); return; }
    if (e.target.closest("#clearCart")){ cart = []; draft.note = ""; saveCart(); closeSheet(); return; }
    if (e.target.closest("#copyOrder")){ copy(orderText()); return; }
    if (e.target.closest("#sendWa")){
      const need = orderType==="dine" ? $("#tableNo") : $("#custName");
      if (!need.value.trim()){ e.preventDefault(); const er=$("#err"); er.hidden=false; er.textContent = orderType==="dine"?t("tableNeeded"):t("nameNeeded"); need.setAttribute("aria-invalid","true"); need.focus(); return; }
      upd();
    }
  };
}
function openWaiter(){
  const tbl = curTable();
  openSheet(`${closeBtn()}<div class="sheet-pad">
    <h2 class="sheet-title" id="sheetTitle">${t("waiter")}</h2>
    <p class="sheet-desc">${t("waiterAsk")}</p>
    <div class="seg three" role="radiogroup">
      <button type="button" role="radio" data-r="rWaiter" aria-checked="true">${I.bell}${t("rWaiter")}</button>
      <button type="button" role="radio" data-r="rBill" aria-checked="false">${I.receipt}${t("rBill")}</button>
      <button type="button" role="radio" data-r="rWater" aria-checked="false">${I.drop}${t("rWater")}</button>
    </div>
    <label class="field"><span>${t("table")}</span><input id="tableNo" maxlength="6" autocomplete="off" value="${esc(tbl)}" placeholder="12"></label>
    <p class="err" id="err" role="alert" hidden></p></div>
    <div class="sheet-foot"><a class="primary wa" id="callWa" href="#" target="_blank" rel="noopener">${I.wa}${t("callNow")}</a></div>`, "waiter-sheet");
  let r = "rWaiter";
  const upd = () => { $("#callWa").href = waUrl(`*${M.restaurant.name}* · ${th("table")} ${$("#tableNo").value.trim()||"-"}\n${th(r)} ${th("calledMsg")}`); };
  upd();
  $("#sheetBody").oninput = e => { saveTable(e.target.value); upd(); };
  $("#sheetBody").onclick = e => {
    const b = e.target.closest("[data-r]");
    if (b){ r = b.dataset.r; $$("[data-r]").forEach(x=>x.setAttribute("aria-checked", x===b)); upd(); }
    if (e.target.closest("#callWa") && !$("#tableNo").value.trim()){ e.preventDefault(); const er=$("#err"); er.hidden=false; er.textContent=t("tableNeeded"); $("#tableNo").setAttribute("aria-invalid","true"); $("#tableNo").focus(); }
  };
}
function openInfo(){
  const r = M.restaurant, d = nowIn().d;
  const order = [1,2,3,4,5,6,0];
  openSheet(`${closeBtn()}<div class="sheet-pad">
    <h2 class="sheet-title" id="sheetTitle">${esc(r.name)}</h2>
    <p class="sheet-desc">${esc(L(r.tagline))}</p>
    <h3 class="sub">${I.clock}${t("hours")}</h3>
    <ul class="hours">${order.map(i=>`<li${i===d?' class="today"':''}><span>${T[lang].days[i]}</span><span dir="ltr">${r.hours[i]?r.hours[i].join(" – "):"—"}</span></li>`).join("")}</ul>
    <h3 class="sub">${I.pin}${t("address")}</h3><p class="sel">${esc(r.address)}</p>
    ${r.mapUrl?`<a class="link-btn" href="${esc(r.mapUrl)}" target="_blank" rel="noopener">${I.pin}Google Maps</a>`:""}
    <h3 class="sub">${I.phone}${t("phone")}</h3><p class="sel"><a class="tel" href="tel:${esc(String(r.phone).replace(/[^\d+]/g,""))}"><bdi dir="ltr">${esc(r.phone)}</bdi></a></p>
    <h3 class="sub">${I.wifi}${t("wifi")}</h3>
    <div class="wifi"><span>${esc(r.wifi.ssid)}</span><span>${t("password")}: <b class="sel">${esc(r.wifi.pass)}</b></span><button type="button" class="link-btn" id="copyWifi">${I.copy}${t("copyShort")}</button></div>
    ${r.instagram?`<a class="link-btn" href="https://instagram.com/${esc(r.instagram)}" target="_blank" rel="noopener">${I.insta}@${esc(r.instagram)}</a>`:""}
    <h3 class="sub">${t("allergens")}</h3>
    <p class="alg">${Object.values(T[lang].alg).join(" · ")}</p>
    <p class="fine">${t("allergenNote")} ${t("vat")}</p>
  </div>`, "info-sheet");
  $("#sheetBody").onclick = e => { if (e.target.closest("#copyWifi")) copy(r.wifi.pass); };
}

/* ---------- utils ---------- */
let tt;
function toast(msg){ const el=$("#toast"); const lv=$("#live"); if (lv){ lv.textContent=""; setTimeout(()=>{ lv.textContent=msg; }, 30); } el.textContent=msg; el.hidden=false; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>{el.classList.remove("show"); setTimeout(()=>el.hidden=true,250)},1600); }
function copy(text){
  const done = () => toast(t("copied"));
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); done(); }
}
let io, activeCat = null;
function setActiveCat(id){
  if (id === activeCat) return;
  activeCat = id;
  const nav = $("#cats");
  $$("button", nav).forEach(b => {
    const on = b.dataset.cat === id;
    b.classList.toggle("on", on);
    if (on){
      // scroll only the category bar sideways; never the page
      const br = b.getBoundingClientRect(), nr = nav.getBoundingClientRect();
      const dx = (br.left + br.width/2) - (nr.left + nr.width/2);
      if (Math.abs(dx) > 4) nav.scrollBy({left: dx, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }
  });
}
function spy(){
  io && io.disconnect();
  activeCat = null;
  const tb = $("#toolbar").offsetHeight;
  document.documentElement.style.setProperty("--tb", tb + "px");
  io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting){ const id = e.target.dataset.cat;
      setActiveCat(id); } });
  }, {rootMargin:`-${tb+10}px 0px -70% 0px`});
  $$("section.cat").forEach(s => io.observe(s));
}

/* ---------- events ---------- */
function bind(){
  $(".lang").onclick = e => { const b = e.target.closest("button"); if(!b) return; lang = b.dataset.lang; store.set("lang", lang); renderStatic(); renderMenu(); renderCartBar(); };
  $("#q").oninput = e => { query = e.target.value; renderMenu(); };
  $("#filters").onclick = e => { const b = e.target.closest("[data-f]"); if(!b) return; const f=b.dataset.f; filters.has(f)?filters.delete(f):filters.add(f); b.setAttribute("aria-pressed", filters.has(f)); renderMenu(); };
  $("#cats").onclick = e => { const b = e.target.closest("[data-cat]"); if(!b) return; if (query||filters.size){ query=""; $("#q").value=""; filters.clear(); renderStatic(); renderMenu(); }
    const s = $("#cat-"+b.dataset.cat); s && s.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); };
  $("#menu").onclick = e => {
    const q = e.target.closest("[data-quick]");
    if (q){ e.stopPropagation(); const it = byId(q.dataset.quick); if (it.options && it.options.length) openItem(it.id); else addToCart(it, [], 1, ""); return; }
    const c = e.target.closest("[data-id]"); if (c) openItem(c.dataset.id);
  };
  $("#menu").onkeydown = e => { if ((e.key==="Enter"||e.key===" ") && e.target.matches(".banner[role=button]")){ e.preventDefault(); openItem(e.target.dataset.id); } };
  $("#cartBar").onclick = openCart;
  $("#waiterBtn").onclick = openWaiter;
  $("#infoBtn").onclick = openInfo;
  $("#sheet").addEventListener("click", e => { if (e.target.id==="sheetBackdrop" || e.target.closest(".close")) closeSheet(); });
  setInterval(renderStatus, 60000);
  document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
  let lastW = innerWidth, rt;
  addEventListener("popstate", () => { if (ignorePop > 0){ ignorePop--; return; } if (!$("#sheet").hidden){ pushed = false; closeSheet(true); } });
  addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(spy, 150); });
}
renderStatic(); renderMenu(); renderCartBar(); bind();
if (location.hash === "#cart") openCart();
})();

</script>
